name: 飞书达人数据每日同步

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取飞书多维表 → feishu_inf.json
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_NICK_FIELD: ${{ secrets.FEISHU_NICK_FIELD }}
        run: python feishu_fetch.py

      - name: 提交并推送更新（防并发冲突）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feishu_inf.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 每日飞书同步 $(date +%F)"
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            if git push; then
              echo "✅ 推送成功"
              exit 0
            fi
            echo "第 $i 次推送被拒，3 秒后重试..."
            sleep 3
          done
          echo "❌ 推送最终失败"
          exit 1
